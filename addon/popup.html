<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Trencher</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>What do I do with this one?</h1>
    <p id="subtitle">one letter, one decision</p>
  </header>

  <main id="decisions">
    <button class="tile" data-action="stay">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12.5l5 5 11-11"/></svg>
      <span>Stays here</span>
    </button>
    <button class="tile" data-action="move">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 6.5h6l2 2.5h10v10H3z"/>
        <path d="M8 13h5m0 0l-2.5-2.5M13 13l-2.5 2.5"/>
      </svg>
      <span>Move on</span>
    </button>
    <button class="tile" data-action="new">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 6.5h6l2 2.5h10v10H3z"/>
        <path d="M12 11v6M9 14h6"/>
      </svg>
      <span>New folder</span>
    </button>
    <button class="tile" data-action="trash">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13"/>
        <path d="M10.5 11v5M13.5 11v5"/>
      </svg>
      <span>Trash</span>
    </button>
    <button class="tile" data-action="spam">
      <svg viewBox="0 0 20 20" aria-hidden="true">
        <path style="fill:currentColor;stroke:none" d="M8.5.5c11.91 4.927 8.427 16.652 3 18 1.5-2.598 0-5-2-5s-3.5 2.402-2 5c-4-.5-8-8-2-14C5 8 7 9 8 8.5c2-1 1.906-5.263.5-8z" fill="currentColor" stroke="none"/>
        <path style="fill:#f4f4f6;stroke:none" d="M8.691.037a.5.5 0 0 0-.636.692c.656 1.278 1.02 2.967.972 4.406-.047 1.439-.507 2.546-1.25 2.918-.261.13-.782.098-1.218-.387-.437-.485-.8-1.445-.565-3.096a.5.5 0 0 0-.848-.424C2.034 7.26 1.473 10.85 2.268 13.697c.794 2.848 2.885 5.013 5.17 5.3a.5.5 0 0 0 .496-.747c-.681-1.179-.658-2.242-.295-3.01C8.002 14.472 8.7 14 9.5 14s1.498.472 1.861 1.24.386 1.831-.295 3.01a.5.5 0 0 0 .555.734c6.037-1.5 9.27-13.9-2.93-18.947Zm.717 1.545c9.382 4.699 7.029 13.754 2.91 15.955.27-.993.31-1.955-.054-2.724C11.752 13.73 10.7 13 9.5 13c-1.2 0-2.252.73-2.764 1.813-.36.761-.325 1.712-.064 2.695-1.436-.621-2.858-1.995-3.44-4.08-.621-2.228-.246-4.939 1.803-7.53.074 1.037.307 1.91.781 2.436.689.765 1.668.983 2.407.613 1.257-.628 1.75-2.152 1.804-3.779.04-1.18-.224-2.417-.619-3.586Z" fill="#f4f4f6" stroke="none"/>
      </svg>
      <span>Spam</span>
    </button>
  </main>

  <section id="movePanel" hidden>
    <div class="row">
      <input id="search" type="search" placeholder="narrow the list">
      <button class="ghost" data-close="movePanel">back</button>
    </div>
    <p class="hint">Trash is never offered here: it has its own button.</p>
    <ul id="folderList"></ul>
  </section>

  <section id="newPanel" hidden>
    <div class="row">
      <input id="newName" type="text" placeholder="name of the new folder" autofocus>
      <button class="ghost" data-close="newPanel">back</button>
    </div>
    <label class="hint" for="newParent">inside</label>
    <select id="newParent"></select>
    <button id="createBtn" class="primary">Create and file here</button>
  </section>

  <footer id="status" role="status"></footer>
  <script src="menu-map.js"></script>
  <script src="grouping.js"></script>
  <script src="popup.js"></script>
</body>
</html>
